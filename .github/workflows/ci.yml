name: cross-platform tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\setup_windows.ps1 -Python (Get-Command python).Source
      - name: Set up Ubuntu runtime
        if: runner.os == 'Linux'
        shell: bash
        run: PYTHON="$(command -v python)" bash scripts/setup_ubuntu.sh
      - name: Test Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          .\.venv\Scripts\python.exe -m go2_mujoco_benchmark.doctor --allow-missing-policy
      - name: Test Ubuntu runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m go2_mujoco_benchmark.doctor --allow-missing-policy
